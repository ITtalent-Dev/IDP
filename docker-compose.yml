name: auth-service

services:
  auth-service:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MIGRATE_ON_START: "true"
      AUTHENTIK_ISSUER: http://authentik.localhost:9000/application/o/auth-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - ago

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ago

volumes:
  pgdata:

networks:
  ago:
    name: ago
