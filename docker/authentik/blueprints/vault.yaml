version: 1
metadata:
  name: vault (local development)
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/providers-oauth2.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-authorization-implicit-consent.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-invalidation.yaml
      required: true

  - model: authentik_core.group
    id: vault-admins
    identifiers:
      name: vault-admins
    attrs:
      name: vault-admins

  - model: authentik_core.user
    identifiers:
      username: vault-admin
    attrs:
      username: vault-admin
      name: Vault Admin Local
      email: vault-admin@authentik.local
      password: vault-admin-password-123
      is_active: true
      groups:
        - !KeyOf vault-admins

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: vault
    attrs:
      name: vault
      client_type: confidential
      client_id: vault-local
      client_secret: vault-local-secret
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      include_claims_in_id_token: true
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:8200/ui/vault/auth/oidc/oidc/callback
          redirect_uri_type: authorization
        - matching_mode: strict
          url: http://localhost:8250/oidc/callback
          redirect_uri_type: authorization
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: application
    identifiers:
      slug: vault
    attrs:
      name: Vault
      slug: vault
      provider: !KeyOf provider
      meta_launch_url: http://localhost:8200/ui/vault/auth?with=oidc
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !KeyOf vault-admins
    attrs:
      order: 0
